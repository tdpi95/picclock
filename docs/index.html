<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" href="/picclock/icon.png" />
        <link rel="manifest" href="/picclock/manifest.json" />
        <meta name="theme-color" content="#000000" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>PicClock - Digital Photo Frame</title>
        <script src="https://accounts.google.com/gsi/client" async defer></script>
        <meta
            name="description"
            content="Turn any device into a digital photo frame with a clock. Supports Bing, Picsum, and local photos."
        />
        <meta
            name="keywords"
            content="digital photo frame, clock app, react photo frame app"
        />
      <script type="module" crossorigin src="/picclock/assets/index-CpxSdml9.js"></script>
      <link rel="stylesheet" crossorigin href="/picclock/assets/index-B_qe58_x.css">
    </head>
    <body>
        <div id="root"></div>
        <script>
            if ("serviceWorker" in navigator) {
                window.addEventListener("load", () => {
                    navigator.serviceWorker
                        .register("/picclock/sw.js")
                        .then((reg) =>
                            console.log("Service Worker registered:", reg)
                        )
                        .catch((err) =>
                            console.log("Service Worker registration failed:", err)
                        );
                });
            }
        </script>
    </body>
</html>
